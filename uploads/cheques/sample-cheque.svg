<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ebf4f6"/>
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q 10 5, 20 20 T 40 20" fill="none" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Cheque Body -->
  <rect x="10" y="10" width="780" height="340" rx="12" fill="url(#bg)" stroke="#94a3b8" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="340" fill="url(#guilloche)"/>

  <!-- Crossing Marks (Account Payee Only) -->
  <line x1="25" y1="20" x2="115" y2="20" stroke="#1e293b" stroke-width="2"/>
  <line x1="25" y1="36" x2="115" y2="36" stroke="#1e293b" stroke-width="2"/>
  <text x="32" y="30" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0f172a" letter-spacing="1">A/C PAYEE ONLY</text>

  <!-- Bank Logo & Name -->
  <circle cx="165" cy="45" r="16" fill="#1e3a8a"/>
  <text x="160" y="51" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">H</text>
  <text x="195" y="42" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">HDFC BANK</text>
  <text x="195" y="56" font-family="sans-serif" font-size="10" fill="#64748b">Nehru Place Branch, New Delhi - 110019 | IFSC: HDFC0000124</text>

  <!-- Date Boxes -->
  <g transform="translate(600, 25)">
    <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">DATE</text>
    <rect x="35" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="38" y="15" font-family="monospace" font-size="12" font-weight="bold">0</text>
    <rect x="49" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="52" y="15" font-family="monospace" font-size="12" font-weight="bold">3</text>

    <rect x="68" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="71" y="15" font-family="monospace" font-size="12" font-weight="bold">1</text>
    <rect x="82" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="85" y="15" font-family="monospace" font-size="12" font-weight="bold">0</text>

    <rect x="101" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="104" y="15" font-family="monospace" font-size="12" font-weight="bold">2</text>
    <rect x="115" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="118" y="15" font-family="monospace" font-size="12" font-weight="bold">0</text>
    <rect x="129" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="132" y="15" font-family="monospace" font-size="12" font-weight="bold">2</text>
    <rect x="143" y="0" width="14" height="20" fill="#fff" stroke="#94a3b8"/>
    <text x="146" y="15" font-family="monospace" font-size="12" font-weight="bold">6</text>
  </g>

  <!-- PAY Line -->
  <text x="40" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">PAY</text>
  <line x1="75" y1="117" x2="680" y2="117" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="85" y="112" font-family="cursive, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">M/s Rajesh Traders</text>
  <text x="690" y="115" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">OR BEARER</text>

  <!-- RUPEES Line -->
  <text x="40" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">RUPEES</text>
  <line x1="100" y1="162" x2="520" y2="162" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="110" y="157" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Eighty Five Thousand Only ----------------------</text>

  <!-- Amount Box -->
  <rect x="540" y="132" width="220" height="42" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="160" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">₹ 85,000 /-</text>

  <!-- Account Number Box -->
  <g transform="translate(60, 205)">
    <text x="0" y="-8" font-family="sans-serif" font-size="9" font-weight="bold" fill="#64748b">A/C NO.</text>
    <rect x="0" y="0" width="260" height="30" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="21" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">5020 0049 8921 44</text>
  </g>

  <!-- Signature Area -->
  <g transform="translate(560, 220)">
    <text x="20" y="15" font-family="cursive" font-size="20" fill="#1e3a8a" transform="rotate(-5)">Rajesh Kumar</text>
    <line x1="0" y1="40" x2="190" y2="40" stroke="#94a3b8"/>
    <text x="35" y="55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">SIGNATURE OF DRAWER</text>
  </g>

  <!-- MICR Band at bottom -->
  <rect x="10" y="295" width="780" height="45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="325" font-family="monospace" font-size="18" font-weight="bold" fill="#1e293b" letter-spacing="4">⑈000452⑈ 110240019⑆ 004989⑈ 29</text>
</svg>
